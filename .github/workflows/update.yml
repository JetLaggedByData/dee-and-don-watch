name: Update river data

# Refreshes the SEPA cache, re-runs the detectors and publishes the site.
#
# NOTHING IS COMMITTED. site/data is derived data, regenerated on every run from
# the parquet cache that actions/cache restores. upload-pages-artifact reads the
# runner's filesystem, so the JSON only has to exist at that moment, not live in
# git. Committing it at a 15-minute cadence would add ~35,000 churn commits a
# year and the repository, not the API, would be the thing that broke first.

on:
  schedule:
    # Every 30 minutes, offset off the hour. GitHub's docs warn the schedule
    # event "can be delayed during periods of high loads", that "high load
    # times include the start of every hour", and that "some queued jobs may
    # be dropped" - so treat this as best-effort, not a guarantee. The site
    # shows a stale banner after 6 hours precisely because of that.
    #
    # Half-hourly, not quarter-hourly, deliberately: SEPA document a 5,000
    # credit/day limit for ANONYMOUS access but never state the limit for
    # the Referer access this uses. Rather than assume the two match, this
    # runs at roughly 1,500 credits/day, under any plausible limit. Worth
    # raising to '7,22,37,52' once a registered API key is in place.
    - cron: '7,37 * * * *'
    # Once daily, deep: re-request a 35-day overlap so SEPA's monthly quality
    # control revisions reach the cache. Too expensive to do every 15 minutes.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Ignore the cache and re-fetch the full history (~5,900 SEPA credits)'
        type: boolean
        default: false

permissions:
  # Read-only on contents: nothing is committed any more.
  contents: read
  pages: write      # publish to GitHub Pages
  id-token: write   # OIDC token that deploy-pages requires

# One at a time: two runs pushing to the same branch would race, and Pages
# rejects concurrent deployments.
concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the version the pipeline and tests were developed against.
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # All three data directories are gitignored, so without this a fresh
      # runner would re-backfill everything: ten years of level for 13 gauges
      # (~4,900 credits) plus rainfall (~1,050) against a 5,000/day budget.
      # With a cache hit, an incremental top-up is ~60.
      #
      # ALL THREE PATHS MATTER. Caching only data/raw would leave rainfall and
      # flow empty on a cold cache, and export.py would then quietly publish a
      # level-only site over the good one - worse than failing.
      #
      # The run_id key always saves a fresh entry; restore-keys finds the newest.
      - name: Restore SEPA parquet cache
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/raw_rain
            data/raw_flow
          key: sepa-raw-${{ github.run_id }}
          restore-keys: sepa-raw-

      # Cold cache (the first run, or an entry evicted after 7 days unused):
      # seed from the snapshot attached to the `data-seed` release rather than
      # paying ~6,200 credits to re-download ten years. fetch.py then only
      # requests the gap between the snapshot and now.
      - name: Seed cache from release snapshot
        if: hashFiles('data/raw/*.parquet') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-seed --pattern sepa-seed.tar.gz
          tar -xzf sepa-seed.tar.gz
          rm sepa-seed.tar.gz

      # Before spending any credits: if the detectors are broken, stop here
      # rather than publishing numbers produced by broken code.
      - name: Run tests
        run: pytest -q

      # Two cadences, because the overlap is what costs money. A 15-minute
      # top-up only needs the last few hours; the 35-day overlap that catches
      # SEPA's monthly revisions runs once a day.
      #
      #   every 15 min : ~25 credits  -> ~2,400/day
      #   daily deep   : ~60 credits
      #   budget       : 5,000/day on Referer access
      - name: Decide fetch depth
        id: depth
        run: |
          if [ "${{ github.event.schedule }}" = "17 4 * * *" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deep=true" >> "$GITHUB_OUTPUT"
          else
            echo "deep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch level and rainfall
        env:
          # Optional. Only needed if the Referer-access daily limit is ever hit;
          # request one from hydrometry-requests@sepa.org.uk. SEPA asks that web
          # products polling this often register for one.
          SEPA_ACCESS_KEY: ${{ secrets.SEPA_ACCESS_KEY }}
          DDW_OVERLAP_HOURS: ${{ steps.depth.outputs.deep == 'true' && '840' || '6' }}
        run: python pipeline/fetch.py --only both ${{ inputs.full_backfill && '--full' || '' }}

      # Long-record flow: daily means back to 1929, and every flood peak since
      # 1971. These are sparse series that SEPA bills at the 1-credit minimum,
      # so refreshing them each run costs about 30 credits in total.
      # Long-record flow changes slowly - daily is plenty, and it saves ~255
      # credits on every quarter-hourly run.
      - name: Fetch long-record flow
        if: steps.depth.outputs.deep == 'true'
        env:
          SEPA_ACCESS_KEY: ${{ secrets.SEPA_ACCESS_KEY }}
        run: python pipeline/fetch_flow.py

      - name: Export site data
        run: python pipeline/export.py

      - name: Re-run the backtest
        run: python pipeline/backtest.py --json site/data/backtest.json

      - name: Re-run the downstream travel-time analysis
        run: python pipeline/wave.py --json site/data/wave.json

      # Routing skill, refitted on the current record: the held-out skill curve
      # shown on the method page, and the error band the projection uses.
      - name: Re-fit the routing skill curve
        if: steps.depth.outputs.deep == 'true'
        run: python pipeline/routing.py --json site/data/routing.json

      # The 12-hour projection at the two outlet gauges. Runs on EVERY pass,
      # not just the deep one: a 12-hour projection issued once a day is stale
      # for most of the day, which would be worse than not drawing it. Fitting
      # takes about 35 s, and this is a public repo, so Actions minutes are not
      # the constraint. Routes water already measured upstream - it uses no
      # weather forecast and is not a warning.
      - name: Project the next 12 hours
        run: python pipeline/forecast.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          # The whole static site. Pages' "deploy from a branch" mode cannot
          # publish an arbitrary folder, which is why this uses the Actions
          # source instead - see the README.
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
