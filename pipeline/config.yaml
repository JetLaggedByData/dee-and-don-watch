# Every live 15-minute level gauge in the Aberdeenshire Dee and Don catchments.
# ts_ids and coordinates confirmed against getTimeseriesList, and `river` against
# getStationList (`river_name`), both on 2026-10-24. Not taken from third-party
# sites. Re-run discover.py to re-confirm.
#
# `river` is the watercourse the gauge actually sits on, which is NOT the
# catchment: Heugh Head is on the Feugh, Invergairn on the Gairn and Invermuick
# on the Muick, all inside the Dee catchment; Pitcaple is on the Urie inside the
# Don catchment. Labelling those "Dee" and "Don" was wrong and broke the
# flood-wave ordering until it was fixed.
#
# `main_stem` marks gauges on the Dee or Don themselves. Only those are
# comparable as a downstream sequence; tributary gauges peak on their own
# schedule and will appear out of order if mixed in.
#
# Excluded as stale: Charr (ends 2021-04-01), Aboyne (2024-10-11),
# Littlemill (2024-08-30).
#
# Excluded as not a river: Meikle Kinord (station_no 356327, ts_id 59425010) is
# on LOCH KINORD. Over 8 years its level moved a total of 0.81 m and its fastest
# hourly rise was 0.024 m/hr - less than half the 0.05 m/hr floor - so it can
# never raise a flag. Its parquet is still cached if it is ever wanted.
stations:
  - name: Garthdee
    river: Dee
    catchment: Dee
    main_stem: true
    station_no: "368014"
    ts_id: "59580010"
    lat: 57.11882365
    lon: -2.124396574
    record_from: 2008-12-03
