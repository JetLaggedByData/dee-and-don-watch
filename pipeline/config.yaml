# Dee & Don Watch - pipeline configuration
#
# Data: SEPA, provisional, Open Government Licence.
# API docs: https://timeseriesdoc.sepa.org.uk/api-documentation/

api:
  # Documented KiWIS base. Every request adds:
  #   service=kisters&type=queryServices&datasource=0
  base_url: https://timeseries.sepa.org.uk/KiWIS/KiWIS
  # SEPA's documented "Referer access" mode: the originator of a request is
  # identified by the Referer header value rather than by IP.
  referer: dee-and-don-watch
  timeout_seconds: 60
  max_retries: 4
  backoff_seconds: 2.0
  # Optional. If set, sent as "Authorization: Basic <value>".
  # Request one from hydrometry-requests@sepa.org.uk, subject "API Key Request".
  access_key_env: SEPA_ACCESS_KEY

discovery:
  # 15-minute river level (stage). SG = stage, 15m.Cmd = 15-minute complete data.
  ts_path: "*/*/SG/15m.Cmd"
  # Must be exact: there is also a "Dee (Galloway)" catchment 200 km away.
  catchments:
    - Dee (Aberdeenshire)
    - Don (Aberdeenshire)
  # A series counts as live if its coverage ends within this many days of today.
  live_within_days: 7

fetch:
  # The reference window every percentile threshold is scored against, so it is
  # a modelling choice, not a storage setting. Changing it moves every threshold
  # and every reported lead time: adding 2016-2018 lowered all 26 thresholds by
  # up to 6.4%, because those two years were quieter than 2018-2026. Do not
  # change it casually, and re-run export/backtest/wave if you do.
  #
  # It also matters on a cold CI cache: if this said 5, a cache miss would
  # rebuild a 5-year reference and silently alter every number on the site.
  backfill_years: 10
  # On incremental runs, re-request this much already-held data and prefer the
  # newer copy. SEPA applies manual quality control "on a monthly cycle", so a
  # revision can land weeks after collection; anything shorter than a month
  # would leave superseded values sitting in our cache forever.
  overlap_hours: 840         # 35 days
  raw_dir: data/raw

detect:
  # Sampling interval of the SG/15m.Cmd series.
  freq_minutes: 15

  # --- data quality ---
  min_gap_minutes: 45        # longer than two missed samples
  # A stuck sensor means NO movement at all, for a long time. Measured against
  # the real cache: these gauges resolve to 1 mm and sit at exactly the same
  # reading for 13-50% of samples, so "unchanged for 3 hours" is ordinary low
  # flow. 12 hours of zero movement covers 0.05-0.74% of the record.
  flatline_minutes: 720
  flatline_tol_m: 0.0
  hampel_window: 13          # samples, ~3h centred
  hampel_sigmas: 3.0

  # --- unusual behaviour, scored against each station's own history ---
  # A median/MAD z-score was tried first and abandoned: at 1 mm resolution its
  # scale was one to four sensor ticks, so z>=3 meant "rose 3 mm in an hour"
  # and fired on 6-11% of all samples. Percentiles of the station's own rise
  # history make the claim checkable: "faster than 99.5% of this record".
  rise_pct_warn: 99.5
  rise_pct_high: 99.9
  # Floor, so that the top 0.5% of a station's rises during a drought cannot be
  # announced as notable when it is 2 mm an hour.
  rise_min_m_per_hr: 0.05
  high_level_pct: 99.0

# --- rainfall -------------------------------------------------------------
# Hourly totals (RE/Hour.Total), not 15-minute. Tipping-bucket gauges resolve
# at 0.2 mm, so sub-hourly rainfall adds noise rather than signal, and hourly
# costs a quarter as many credits for the same ten years.
#
# Rain is NOT run through the level detectors. It is context: it answers
# "did rain precede this rise", which the level series alone cannot.
rain:
  freq_minutes: 60
  raw_dir: data/raw_rain
  backfill_years: 10
  overlap_hours: 840

